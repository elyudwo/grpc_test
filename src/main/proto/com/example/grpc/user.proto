syntax = "proto3";

package com.example.grpc;

option java_multiple_files = true;
option java_package = "com.example.grpc.proto";
option java_outer_classname = "UserProto";

message User {
  string name = 1;
  int32 age = 2;
}

message UserRequest {
  int64 user_id = 1;
}

service UserService {
  rpc GetUser(UserRequest) returns (User);
}
