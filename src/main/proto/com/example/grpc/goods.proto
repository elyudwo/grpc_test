syntax = "proto3";

package com.example.grpc;

option java_multiple_files = true;
option java_package = "com.example.grpc.proto";
option java_outer_classname = "GoodsProto";

message Goods {
  string name = 1;
  int32 price = 2;
}

message GoodsRequest {
  string goodsName = 1;
}

service GoodsService {
  rpc GetGoods(GoodsRequest) returns (Goods);
}